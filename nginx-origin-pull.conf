# Nginx — wajibkan koneksi hanya dari Cloudflare (Authenticated Origin Pull).
# Dipakai di aaPanel untuk site license.pandusolusi.com.
#
# 1. Di VPS, download CA Cloudflare (sekali saja):
#      mkdir -p /etc/nginx/cloudflare &&
#      curl -s https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem \
#        -o /etc/nginx/cloudflare/origin-pull-ca.pem
#
# 2. Di aaPanel → Website → license.pandusolusi.com → Config File,
#    tempel 3 baris di dalam block `server { ... }` yang listen 443 ssl:
#
#      ssl_client_certificate /etc/nginx/cloudflare/origin-pull-ca.pem;
#      ssl_verify_client on;
#
#    Lalu Save → Reload Nginx (aaPanel → App Store → Nginx → Reload).
#
# 3. Di Cloudflare Dashboard → domain panel → SSL/TLS → Origin Server:
#    nyalakan "Authenticated Origin Pulls".
#
# Efek: koneksi langsung ke IP origin (bypass Cloudflare) ditolak saat
# handshake TLS — bahkan bila IP server diketahui penyerang. Akses normal
# lewat Cloudflare (termasuk callback Tripay) tidak terpengaruh.
# Tes: curl -k https://IP-VPS/ harus gagal handshake setelah aktif.
